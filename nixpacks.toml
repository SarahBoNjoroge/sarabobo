[phases.setup]
nixPkgs = ["php83", "php83Extensions.mysqli", "php83Extensions.pdo_mysql", "php83Extensions.curl", "php83Extensions.mbstring", "php83Extensions.openssl", "composer"]

[phases.install]
cmds = ["composer install --ignore-platform-reqs --no-interaction --no-progress"]

[phases.build]
cmds = []

[start]
cmd = "php -S 0.0.0.0:$PORT -t /app"